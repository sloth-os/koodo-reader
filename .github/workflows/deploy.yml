name: Build and deploy PWA

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Weekly rebuild to track upstream dev: Mondays ~09:07 UTC (off-peak).
    - cron: "7 9 * * 1"

permissions:
  contents: read
  issues: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PWA_BASE_PATH: /koodo-reader/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment repo (overlay + patches + scripts)
        uses: actions/checkout@v4
        with:
          path: deploy

      - name: Checkout upstream koodo-reader
        uses: actions/checkout@v4
        with:
          repository: koodo-reader/koodo-reader
          ref: dev
          path: upstream
          # shallow history is fine; patches are generated with full context
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: upstream/yarn.lock

      - name: Install dependencies
        working-directory: upstream
        # --ignore-scripts: upstream postinstall rebuilds native electron deps
        # (better-sqlite3, electron-builder install-app-deps) that the web
        # build never uses; skip them to keep the job fast and green.
        run: yarn install --frozen-lockfile --ignore-scripts

      - name: Apply overlay, patches and build PWA
        id: build
        working-directory: upstream
        run: node ../deploy/scripts/build.mjs --upstream .

      # The build intentionally dies loudly when upstream `dev` drifts away
      # from a patch/kookit anchor. For scheduled runs nobody is watching the
      # log, so surface the drift as an issue instead (deduped by title).
      - name: Open issue when a scheduled build fails
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Weekly PWA build failed - upstream koodo-reader dev drift"
          # Quoted phrase + in:title: an unquoted "$TITLE" would degrade to
          # a title match on "Weekly" plus free-text terms matching bodies.
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search 'in:title "Weekly PWA build failed"' --json number --jq 'length')
          if [ "$OPEN" = "0" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body \
          "The scheduled weekly build failed, most likely because upstream \`koodo-reader@dev\` changed a file that \`patches/\` or the kookit anchor replacements in \`scripts/build.mjs\` depend on. The live site still serves the last successful deployment.

          Failed run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Regenerate the affected patch against current \`dev\` (or update the kookit replacement strings) and re-run the workflow."
          else
            echo "An open drift issue already exists; not creating a duplicate."
          fi

      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: upstream/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
