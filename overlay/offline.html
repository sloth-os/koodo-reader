<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Koodo Reader - Offline</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
        color: #1f1f1f;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: rgb(47, 52, 55);
          color: #eee;
        }
        .card {
          background: rgb(58, 64, 67);
        }
      }
      .card {
        max-width: 420px;
        margin: 24px;
        padding: 40px 36px;
        border-radius: 16px;
        background: #f7f7f7;
        text-align: center;
      }
      .icon {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        display: block;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 10px;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        margin: 0 0 24px;
        opacity: 0.75;
      }
      button {
        appearance: none;
        border: none;
        border-radius: 8px;
        background: #1f1f1f;
        color: #fff;
        font-size: 14px;
        padding: 10px 22px;
        cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        button {
          background: #eee;
          color: rgb(47, 52, 55);
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img class="icon" src="./icons/icon-192x192.png" alt="" />
      <h1>You're offline</h1>
      <p>
        Koodo Reader needs a network connection the first time it loads and
        when a new version is published. Books already stored in your library
        are available offline.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
